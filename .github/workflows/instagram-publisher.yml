name: Publicar Reels no Instagram

on:
  schedule:
    # America/Sao_Paulo (UTC-3): 12:45 and 19:30.
    - cron: "45 15 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas simular (sem publicar)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Publicar proximo Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/publish_instagram.py

      - name: Persistir estado
        if: always()
        run: |
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Atualiza fila do Instagram"
          git push
