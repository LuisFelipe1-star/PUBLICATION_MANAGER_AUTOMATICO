name: Publicar Reels no Instagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar credenciais e simular (sem publicar)"
        required: false
        default: true
        type: boolean
      slot:
        description: "Horario que esta execucao representa"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - "1245"
          - "1930"

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar credenciais
        if: ${{ inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          DRY_RUN: "true"
          PUBLISH_SLOT: ${{ inputs.slot }}
        run: python scripts/publish_instagram.py

      - name: Reservar proximo Reel
        if: ${{ !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          PUBLISH_SLOT: ${{ inputs.slot }}
          PUBLISH_PHASE: reserve
        run: python scripts/publish_instagram.py

      - name: Persistir reserva antes da Meta
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Atualiza fila do Instagram"
          git push

      - name: Publicar Reel reservado
        if: ${{ !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          PUBLISH_SLOT: ${{ inputs.slot }}
          PUBLISH_PHASE: publish
        run: python scripts/publish_instagram.py

      - name: Persistir resultado da Meta
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Registra resultado do Instagram"
          git push

      - name: Finalizar fila
        if: ${{ success() && !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          PUBLISH_SLOT: ${{ inputs.slot }}
          PUBLISH_PHASE: finalize
        run: python scripts/publish_instagram.py

      - name: Persistir finalizacao
        if: ${{ success() && !inputs.dry_run }}
        run: |
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Finaliza fila do Instagram"
          git push

      - name: Abrir ou atualizar alerta de falha
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Alerta] Falha no publicador do Instagram';
            const body = `Execucao com falha: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nConfira tambem state/published.json. Uma reserva pendente exige revisao manual no Instagram antes de nova tentativa.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
